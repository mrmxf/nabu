<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
    <defs>
        <!-- Clay Tablet Background Gradient -->
        <linearGradient id="tabletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EAC16C" /> <!-- Yellow Ochre Light -->
            <stop offset="100%" stop-color="#D4A345" /> <!-- Yellow Ochre Base -->
        </linearGradient>
        
        <!-- Subtle Drop Shadow for depth -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3A1C0B" flood-opacity="0.3"/>
        </filter>

        <!-- CSS Animation for the Stamping Effect -->
        <style>
            .wedge-group {
                /* Ensures the scale animation pulls toward the exact center of the 120x120 canvas */
                transform-origin: 60px 60px;
                /* Runs a 10 second animation infinitely */
                animation: stampWedge 10s infinite;
            }
            
            @keyframes stampWedge {
                /* 0 to 1s: Logo starts blank */
                0%, 10% {
                    opacity: 0;
                    transform: scale(2);
                }
                /* 1.5s: Wedges strike the clay */
                15% {
                    opacity: 1;
                    transform: scale(0.95);
                }
                /* 1.8s: Wedges settle into their final size */
                18% {
                    transform: scale(1);
                }
                /* 1.8s to 8.5s: The wedges sit cleanly pressed into the tablet */
                85% {
                    opacity: 1;
                    transform: scale(1);
                }
                /* 9.5s to 10s: Slowly fade out to a blank tablet to restart the loop */
                95%, 100% {
                    opacity: 0;
                    transform: scale(1);
                }
            }
        </style>
    </defs>
    
    <!-- App Icon Background / Clay Tablet (Remains static) -->
    <rect x="10" y="10" width="100" height="100" rx="22" ry="22" fill="url(#tabletGrad)" filter="url(#shadow)" stroke="#A84532" stroke-width="2"/>
    
    <!-- Inner Tablet Rim (Simulating an impressed border) -->
    <rect x="16" y="16" width="88" height="88" rx="16" ry="16" fill="none" stroke="#F6D488" stroke-width="2" opacity="0.7"/>
    
    <!-- Animated Wedges Group -->
    <g class="wedge-group">
        <!-- Nabu's Central Vertical Wedge (Lapis Lazuli Blue) -->
        <g filter="url(#shadow)">
            <path d="M 35 30 
                     L 85 30 
                     L 66 48 
                     L 64 85 
                     L 56 85 
                     L 54 48 
                     Z" 
                  fill="#3B5791"/>
                  
            <!-- Inner highlight to give the wedge a 3D stamped impression -->
            <path d="M 35 30 L 85 30 L 60 48 Z" fill="#5D7BB9" opacity="0.8"/>
        </g>

        <!-- Decorative Flanking Horizontal Wedges (Cochineal Red) -->
        <g filter="url(#shadow)">
            <!-- Left horizontal wedge -->
            <path d="M 22 55 L 22 65 L 36 60 Z" fill="#A84532"/>
            <!-- Right horizontal wedge -->
            <path d="M 98 55 L 98 65 L 84 60 Z" fill="#A84532"/>
        </g>
    </g>
</svg>